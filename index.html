<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Balım'a ❤️</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: Georgia, serif;
      background: linear-gradient(135deg, #2b0a18, #7a1838, #d94f70);
      color: white;
      position: relative;
    }

    .container {
      width: 90%;
      max-width: 600px;
      text-align: center;
      padding: 40px 25px;
      position: relative;
      z-index: 2;
    }

    .heart {
      font-size: 70px;
      margin-bottom: 20px;
      animation: heartbeat 1.5s infinite;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 20px;
    }

    .subtitle {
      font-size: 22px;
      font-style: italic;
      opacity: 0.9;
      margin-bottom: 25px;
    }

    .date {
      font-size: 18px;
      margin-bottom: 35px;
      letter-spacing: 1px;
    }

    button {
      border: none;
      padding: 16px 35px;
      border-radius: 50px;
      font-size: 18px;
      font-weight: bold;
      color: #7a1838;
      background: white;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.08);
    }

    .floating-heart {
      position: absolute;
      bottom: -50px;
      font-size: 25px;
      animation: float 7s linear infinite;
      opacity: 0.7;
    }

    .heart1 { left: 10%; animation-delay: 0s; }
    .heart2 { left: 30%; animation-delay: 2s; }
    .heart3 { left: 55%; animation-delay: 4s; }
    .heart4 { left: 80%; animation-delay: 1s; }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    @keyframes float {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }

      20% {
        opacity: 0.8;
      }

      100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 38px;
      }

      .subtitle {
        font-size: 19px;
      }

      .heart {
        font-size: 60px;
      }
    }
  </style>
</head>

<body>

  <div class="floating-heart heart1">❤️</div>
  <div class="floating-heart heart2">💕</div>
  <div class="floating-heart heart3">❤️</div>
  <div class="floating-heart heart4">💗</div>

  <div class="container">

    <div class="heart">❤️</div>

    <h1>Balım'a</h1>

    <p class="subtitle">
      “Bu site sadece sana ait…”
    </p>

    <p class="date">
      15.01.2025'ten beri ❤️
    </p>

    <button onclick="basla()">
      Başla ❤️
    </button>

  </div>

  <script>
    function basla() {
      alert("Hikâyemize hoş geldin Balım ❤️");
    }
  </script>

</body>
</html>
